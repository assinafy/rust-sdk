name: Release

on:
  push:
    tags:
      - "v*"

# Only ever run one publish per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: publishing authenticates to crates.io via CARGO_REGISTRY_TOKEN,
# so the workflow itself only needs read access to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/assinafy
    steps:
      # This job holds the crates.io publish token, so every third-party
      # action is pinned to an immutable commit SHA rather than a mutable
      # tag or branch. Update via Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "false"

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(cargo pkgid | sed -E 's/.*[#@]([^@]+)$/\1/')
          echo "tag=$TAG cargo=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - run: cargo test --all-targets --all-features --locked
      - run: cargo test --doc --all-features --locked

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
