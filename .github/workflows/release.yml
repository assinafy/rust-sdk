name: Release

on:
  push:
    tags:
      - "v*"

# Only ever run one publish per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: crates.io exchanges GitHub's short-lived OIDC identity for a
# temporary publish token after all release checks pass.
permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/assinafy
    steps:
      # Every third-party action is pinned to an immutable commit SHA rather
      # than a mutable tag or branch. Update via Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "false"

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(cargo pkgid | sed -E 's/.*[#@]([^@]+)$/\1/')
          echo "tag=$TAG cargo=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --all-features --locked
      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo test --doc --all-features --locked
          cargo doc --no-deps --all-features --locked
      - run: cargo package --locked

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
