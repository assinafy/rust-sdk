name: Sandbox

# Live integration tests against the Assinafy sandbox API. These are #[ignore]
# by default and only run here. They require the repository secrets
# ASSINAFY_API_KEY, ASSINAFY_ACCOUNT_ID, and two runtime-only test inbox
# secrets. The workflow fails clearly when any secret is not configured.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: sandbox
  cancel-in-progress: false

# Least privilege: the sandbox job only reads the repo and configured secrets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sandbox:
    name: sandbox integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs: this job has live API credentials
      # in scope, so a compromised upstream tag could exfiltrate them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate sandbox secrets
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
          ASSINAFY_TEST_EMAIL_PRIMARY: ${{ secrets.ASSINAFY_TEST_EMAIL_PRIMARY }}
          ASSINAFY_TEST_EMAIL_SECONDARY: ${{ secrets.ASSINAFY_TEST_EMAIL_SECONDARY }}
        run: |
          set -eu
          test -n "$ASSINAFY_API_KEY" || { echo "::error::Configure ASSINAFY_API_KEY"; exit 1; }
          test -n "$ASSINAFY_ACCOUNT_ID" || { echo "::error::Configure ASSINAFY_ACCOUNT_ID"; exit 1; }
          test -n "$ASSINAFY_TEST_EMAIL_PRIMARY" || { echo "::error::Configure ASSINAFY_TEST_EMAIL_PRIMARY"; exit 1; }
          test -n "$ASSINAFY_TEST_EMAIL_SECONDARY" || { echo "::error::Configure ASSINAFY_TEST_EMAIL_SECONDARY"; exit 1; }
      - name: Run sandbox integration tests
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
          ASSINAFY_TEST_EMAIL_PRIMARY: ${{ secrets.ASSINAFY_TEST_EMAIL_PRIMARY }}
          ASSINAFY_TEST_EMAIL_SECONDARY: ${{ secrets.ASSINAFY_TEST_EMAIL_SECONDARY }}
        run: cargo test --test sandbox --locked -- --ignored --test-threads=1
