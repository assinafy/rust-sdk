version: 2
updates:
  # Keeps the SHA-pinned `uses:` refs in .github/workflows current (Dependabot
  # rewrites both the SHA and the trailing version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
