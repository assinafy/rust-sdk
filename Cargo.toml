[package]
name = "assinafy"
version = "3.0.0"
edition = "2024"
rust-version = "1.86"
description = "Idiomatic async Rust SDK for the Assinafy electronic signature API (https://api.assinafy.com.br/v1)."
license = "MIT"
repository = "https://github.com/assinafy/rust-sdk"
homepage = "https://assinafy.com.br"
documentation = "https://docs.rs/assinafy"
readme = "README.md"
exclude = ["/AUDIT.md", "/AGENTS.md", "/CLAUDE.md"]
keywords = ["assinafy", "signature", "esign", "api", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["rustls-tls"]
# Use rustls-based TLS without relying on the operating system's TLS stack.
rustls-tls = ["reqwest/rustls"]
# Use the OS-native TLS stack instead of rustls.
native-tls = ["reqwest/native-tls"]

[dependencies]
bytes = "1"
# OAuth 2.1 PKCE: `getrandom` for the code verifier's entropy and `sha2` for
# its mandatory S256 challenge. Both are leaf crates with no further
# dependencies of their own.
getrandom = "0.4"
sha2 = "0.11"
# `default-features = false` only to opt out of reqwest's `default-tls`, which
# this crate's own rustls-tls/native-tls features select instead. The rest of
# reqwest's defaults (http2, system-proxy, charset) are re-enabled explicitly —
# without `system-proxy` the client silently ignores HTTP(S)_PROXY/NO_PROXY, and
# without `http2` it is HTTP/1.1-only.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "query",
    "gzip",
    "http2",
    "system-proxy",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }
url = "2"

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[package.metadata.docs.rs]
all-features = true
